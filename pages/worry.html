<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[AI 학사 헬퍼] 사유서 세탁기 | Shee8lramy</title>
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .persona-btn.active {
      border-color: #f59e0b !important;
      background: rgba(245, 158, 11, 0.15) !important;
      color: #fbbf24 !important;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
    }
    .spinner-spin {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24">

  <div class="background">
    <canvas id="star-canvas"></canvas>
    <div class="moon"></div>
  </div>

  <main class="phone max-w-md mx-auto min-h-screen relative flex flex-col">
    <!-- 헤더 -->
    <header class="header p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
      <div class="flex items-center gap-3">
        <button class="btn-back text-slate-400 hover:text-white text-xl" onclick="location.href='../index.html'" title="뒤로가기">←</button>
        <div>
          <h1 class="text-base font-bold text-amber-400 flex items-center gap-1.5">
            <span>🧼</span> [AI 학사 헬퍼] 사유서 세탁기
          </h1>
          <p class="text-[11px] text-slate-400">날것의 핑계를 초공손 교수님 메일로 반짝반짝 세탁</p>
        </div>
      </div>
    </header>

    <!-- 메인 메인 컨텐츠 -->
    <div class="content p-4 flex-1 flex flex-col gap-4 overflow-y-auto">
      <!-- 안내 카드 -->
      <section class="glass card p-4 rounded-xl border border-slate-800 bg-slate-900/60 backdrop-blur-sm">
        <div class="flex items-start gap-3">
          <span class="text-3xl">🧺</span>
          <div>
            <h2 class="font-bold text-sm text-slate-200">교수님 맞춤형 지각/결석 사유서 세탁기</h2>
            <p class="text-xs text-slate-400 mt-1 leading-relaxed">
              "늦잠, 버스 연착, 숙취... 날것의 핑계를 입력하면 초공손 비즈니스 메일로 세탁해 드립니다."
            </p>
          </div>
        </div>
      </section>

      <!-- 날것 핑계 입력 섹션 -->
      <section class="glass card p-4 rounded-xl border border-slate-800 bg-slate-900/60 backdrop-blur-sm flex flex-col gap-3">
        <label class="text-xs font-bold text-slate-300 flex items-center justify-between">
          <span>📝 날것의 핑계 (입력)</span>
          <span class="text-[10px] text-slate-500 font-normal">100% 오프라인 안심 세탁</span>
        </label>

        <textarea id="raw-excuse" class="w-full h-28 bg-slate-950/80 border border-slate-800 rounded-lg p-3 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-400/60 transition-colors resize-none leading-relaxed" placeholder="예: 늦잠 자서 1교시 셔틀 놓쳤는데 비 개많이 와서 지각할 것 같아요 ㅠㅠ"></textarea>

        <!-- 원클릭 예시 입력 버튼 3종 -->
        <div>
          <span class="text-[10px] font-semibold text-slate-400 mb-1.5 block">🔘 원클릭 예시 입력</span>
          <div class="grid grid-cols-3 gap-1.5">
            <button type="button" class="btn-quick-example text-[11px] py-1.5 px-2 bg-slate-800/80 hover:bg-amber-500/20 text-slate-300 hover:text-amber-300 border border-slate-700/60 hover:border-amber-500/40 rounded-lg transition-all text-center truncate" data-text="비가 폭우처럼 쏟아져서 셔틀버스 줄이 너무 길어서 1교시 셔틀을 놓쳐 지각할 것 같습니다 ㅠㅠ">
              🌧️ 비 와서 셔틀 놓침
            </button>
            <button type="button" class="btn-quick-example text-[11px] py-1.5 px-2 bg-slate-800/80 hover:bg-amber-500/20 text-slate-300 hover:text-amber-300 border border-slate-700/60 hover:border-amber-500/40 rounded-lg transition-all text-center truncate" data-text="어제 밤샘 팀플 과제 마감 채우느라 잠을 못 자고 알람 소리를 못 들어서 지각입니다 교수님 죄송합니다">
              💻 팀플 과제 마감
            </button>
            <button type="button" class="btn-quick-example text-[11px] py-1.5 px-2 bg-slate-800/80 hover:bg-amber-500/20 text-slate-300 hover:text-amber-300 border border-slate-700/60 hover:border-amber-500/40 rounded-lg transition-all text-center truncate" data-text="갑자기 감기 오한 기운에 몸살이 나고 열이 나서 병원 진료 후 늦게 참석해야 할 것 같아요 ㅠㅠ">
              🤒 감기 기운 자체휴강
            </button>
          </div>
        </div>
      </section>

      <!-- 교수님 페르소나 3종 선택 -->
      <section class="glass card p-4 rounded-xl border border-slate-800 bg-slate-900/60 backdrop-blur-sm flex flex-col gap-2.5">
        <label class="text-xs font-bold text-slate-300">
          🎓 교수님 성향 선택 (페르소나 3종)
        </label>
        
        <div class="grid grid-cols-3 gap-2">
          <button type="button" class="persona-btn active flex flex-col items-center justify-center p-2.5 bg-slate-950/60 border border-slate-800 rounded-lg transition-all" data-persona="strict">
            <span class="text-lg">🏛️</span>
            <span class="text-[11px] font-bold mt-1">원칙주의 엄격형</span>
            <span class="text-[9px] text-slate-400 mt-0.5 text-center">학칙 제14조/증빙</span>
          </button>

          <button type="button" class="persona-btn flex flex-col items-center justify-center p-2.5 bg-slate-950/60 border border-slate-800 rounded-lg transition-all text-slate-400" data-persona="emotional">
            <span class="text-lg">🌱</span>
            <span class="text-[11px] font-bold mt-1">인자한 감성형</span>
            <span class="text-[9px] text-slate-400 mt-0.5 text-center">건강안부/깊은탄식</span>
          </button>

          <button type="button" class="persona-btn flex flex-col items-center justify-center p-2.5 bg-slate-950/60 border border-slate-800 rounded-lg transition-all text-slate-400" data-persona="concise">
            <span class="text-lg">⚡</span>
            <span class="text-[11px] font-bold mt-1">바쁜 연구형</span>
            <span class="text-[9px] text-slate-400 mt-0.5 text-center">사족제로/3줄요약</span>
          </button>
        </div>
      </section>

      <!-- 세탁 실행 버튼 -->
      <button type="button" id="btn-clean-start" class="w-full py-3 px-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-extrabold text-sm rounded-xl shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2">
        <span>✨</span> 마법처럼 사유서 세탁하기
      </button>

      <!-- 0.8초 스피너 오버레이 (숨김) -->
      <div id="loading-spinner" class="hidden p-6 bg-slate-900/90 border border-amber-500/30 rounded-xl flex flex-col items-center justify-center gap-3">
        <div class="w-10 h-10 border-4 border-amber-500/30 border-t-amber-400 rounded-full spinner-spin"></div>
        <p class="text-xs text-amber-300 font-bold animate-pulse">양털 세탁기로 핑계를 세탁하는 중... 🧺 (0.8초)</p>
      </div>

      <!-- 세탁 결과 카드리스트 (기본 숨김) -->
      <section id="result-card" class="hidden glass card p-4 rounded-xl border border-amber-500/40 bg-slate-900/90 backdrop-blur-md flex flex-col gap-3 transition-all">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
          <span class="text-xs font-bold text-amber-400 flex items-center gap-1.5">
            <span>🧼</span> 세탁 완료된 초공손 이메일
          </span>
          <span class="text-[10px] bg-amber-400/20 text-amber-300 px-2 py-0.5 rounded-full font-semibold">발송 준비 완료</span>
        </div>

        <!-- 메일 정보 -->
        <div class="space-y-2 text-xs">
          <div class="bg-slate-950/80 p-2.5 rounded-lg border border-slate-800">
            <span class="text-slate-400 block text-[10px]">📌 [메일 제목]</span>
            <span id="res-title" class="font-bold text-slate-100 text-[11px]"></span>
          </div>

          <div class="grid grid-cols-2 gap-2 text-[11px]">
            <div class="bg-slate-950/80 p-2 rounded-lg border border-slate-800">
              <span class="text-slate-400 block text-[9px]">수신</span>
              <span id="res-recipient" class="font-medium text-slate-200"></span>
            </div>
            <div class="bg-slate-950/80 p-2 rounded-lg border border-slate-800">
              <span class="text-slate-400 block text-[9px]">발신</span>
              <span id="res-sender" class="font-medium text-slate-200"></span>
            </div>
          </div>

          <!-- 본문 -->
          <div class="bg-slate-950/90 p-3 rounded-lg border border-slate-800 font-mono text-[11px] leading-relaxed text-slate-200 whitespace-pre-wrap select-all" id="res-body"></div>

          <!-- 첨부 서류 가이드 -->
          <div class="bg-amber-500/10 border border-amber-500/30 p-2.5 rounded-lg text-[11px] text-amber-300 font-semibold" id="res-evidence"></div>
        </div>

        <!-- 클립보드 복사 버튼 -->
        <button type="button" id="btn-copy-clipboard" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-xs rounded-lg border border-amber-400/30 hover:border-amber-400/60 transition-all flex items-center justify-center gap-1.5 mt-1">
          <span>📋</span> 원클릭 클립보드 복사
        </button>
      </section>
    </div>

    <!-- 통일 하단 6탭 네비게이션 바 -->
    <nav class="bottom-nav fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 backdrop-blur-md border-t border-slate-800 flex justify-around items-center py-2 px-1 z-50">
      <a href="../index.html" data-href="../index.html" class="nav-btn nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-amber-400 transition-colors">
        <span class="text-xl nav-icon">🏠</span>
        <span class="text-[10px] mt-0.5 font-medium nav-label">홈</span>
      </a>
      <a href="./wake.html" data-href="./wake.html" class="nav-btn nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-amber-400 transition-colors">
        <span class="text-xl nav-icon">⏰</span>
        <span class="text-[10px] mt-0.5 font-medium nav-label">기상</span>
      </a>
      <a href="./calendar.html" data-href="./calendar.html" class="nav-btn nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-amber-400 transition-colors">
        <span class="text-xl nav-icon">📅</span>
        <span class="text-[10px] mt-0.5 font-medium nav-label">캘린더</span>
      </a>
      <a href="./friends.html" data-href="./friends.html" class="nav-btn nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-amber-400 transition-colors">
        <span class="text-xl nav-icon">👥</span>
        <span class="text-[10px] mt-0.5 font-medium nav-label">친구</span>
      </a>
      <a href="./workshop.html" data-href="./workshop.html" class="nav-btn nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-amber-400 transition-colors">
        <span class="text-xl nav-icon">🎨</span>
        <span class="text-[10px] mt-0.5 font-medium nav-label">공방</span>
      </a>
      <a href="./gallery.html" data-href="./gallery.html" class="nav-btn nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-amber-400 transition-colors">
        <span class="text-xl nav-icon">🏆</span>
        <span class="text-[10px] mt-0.5 font-medium nav-label">갤러리</span>
      </a>
    </nav>
  </main>

  <script type="module">
    import { initCommon, showToast } from '../js/app.js';
    import { cleanExcuse } from '../js/worry.js';

    document.addEventListener('DOMContentLoaded', () => {
      initCommon();

      const rawTextarea = document.getElementById('raw-excuse');
      const personaBtns = document.querySelectorAll('.persona-btn');
      const btnCleanStart = document.getElementById('btn-clean-start');
      const loadingSpinner = document.getElementById('loading-spinner');
      const resultCard = document.getElementById('result-card');
      const btnCopyClipboard = document.getElementById('btn-copy-clipboard');

      let currentPersona = 'strict';
      let lastCleanedResult = null;

      // 1. 예시 클릭 핸들러
      document.querySelectorAll('.btn-quick-example').forEach(btn => {
        btn.addEventListener('click', () => {
          rawTextarea.value = btn.dataset.text;
          rawTextarea.focus();
          showToast('💡 예시 핑계가 입력되었습니다.', 'info');
        });
      });

      // 2. 페르소나 버튼 선택
      personaBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          personaBtns.forEach(b => {
            b.classList.remove('active');
            b.classList.add('text-slate-400');
          });
          btn.classList.add('active');
          btn.classList.remove('text-slate-400');
          currentPersona = btn.dataset.persona;
        });
      });

      // 3. 세탁하기 실행 (0.8초 스피너 동작 후 결과 출력)
      btnCleanStart.addEventListener('click', () => {
        const val = rawTextarea.value.trim();
        if (!val) {
          showToast('⚠️ 날것의 핑계나 사유를 먼저 입력해주세요!', 'warning');
          rawTextarea.focus();
          return;
        }

        resultCard.classList.add('hidden');
        loadingSpinner.classList.remove('hidden');

        setTimeout(() => {
          loadingSpinner.classList.add('hidden');
          
          const result = cleanExcuse(val, currentPersona);
          lastCleanedResult = result;

          document.getElementById('res-title').textContent = result.title;
          document.getElementById('res-recipient').textContent = result.recipient;
          document.getElementById('res-sender').textContent = result.sender;
          document.getElementById('res-body').textContent = result.body;
          document.getElementById('res-evidence').textContent = result.evidence;

          resultCard.classList.remove('hidden');
          resultCard.scrollIntoView({ behavior: 'smooth' });
          showToast('✨ 초공손 비즈니스 사유서로 세탁되었습니다!', 'success');
        }, 800);
      });

      // 4. 원클릭 클립보드 복사
      btnCopyClipboard.addEventListener('click', () => {
        if (!lastCleanedResult) return;
        const textToCopy = `[제목]: ${lastCleanedResult.title}\n[수신]: ${lastCleanedResult.recipient}\n\n${lastCleanedResult.body}\n\n${lastCleanedResult.evidence}`;
        
        navigator.clipboard.writeText(textToCopy).then(() => {
          showToast('📋 세탁된 사유서가 클립보드에 복사되었습니다! 교수님께 바로 전송하세요.', 'success', 3500);
        }).catch(() => {
          showToast('📋 복사 완료되었습니다.', 'success');
        });
      });
    });
  </script>
</body>
</html>
