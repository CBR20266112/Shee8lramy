<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캘린더 & 일정 | Shee8lramy 쉽알라미</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    /* ── 월간 캘린더 ── */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-3);
    }
    .cal-month-label {
      font-size: var(--font-size-lg);
      font-weight: 800;
      color: var(--text-primary);
    }
    .cal-nav-btn {
      background: var(--glass-bg-light);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      width: 32px; height: 32px;
      color: var(--text-primary);
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition-base);
    }
    .cal-nav-btn:hover { background: rgba(167,139,250,0.2); }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: var(--space-1);
    }
    .cal-weekday {
      text-align: center;
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: var(--space-1) 0;
    }
    .cal-weekday:first-child { color: #ff6b6b; }
    .cal-weekday:last-child { color: #7dd3fc; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .cal-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 4px 2px 2px;
      border-radius: var(--radius-xs);
      cursor: pointer;
      transition: all var(--transition-base);
      position: relative;
      min-height: 38px;
    }
    .cal-day:hover { background: var(--glass-bg-light); }
    .cal-day.today { background: rgba(167,139,250,0.2); }
    .cal-day.today .cal-day-num { color: var(--color-purple); font-weight: 900; }
    .cal-day.selected { background: rgba(167,139,250,0.3); border: 1px solid var(--color-purple); }
    .cal-day.other-month { opacity: 0.3; }
    .cal-day-num {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1;
    }
    .cal-day:first-child .cal-day-num,
    .cal-day:nth-child(7n+1) .cal-day-num { color: #ff6b6b; }
    .cal-day:nth-child(7n) .cal-day-num { color: #7dd3fc; }
    .cal-dots {
      display: flex;
      gap: 1px;
      margin-top: 2px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .cal-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
    }
    .cat-과제 { background: #ff9a3c; }
    .cat-발표 { background: #ff6b6b; }
    .cat-시험 { background: #c77dff; }
    .cat-수업 { background: #6bcb77; }
    .cat-스터디 { background: #4d96ff; }
    .cat-제출 { background: #ffd93d; }
    .cat-모임 { background: #ff6b6b; }
    .cat-일정 { background: #a78bfa; }

    /* ── 채팅형 자연어 입력 ── */
    .chat-container {
      background: rgba(10,10,30,0.4);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
    }
    .chat-msg {
      display: flex;
      gap: var(--space-2);
      align-items: flex-end;
    }
    .chat-msg.user { flex-direction: row-reverse; }
    .chat-bubble {
      max-width: 80%;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      font-size: var(--font-size-xs);
      line-height: 1.5;
    }
    .chat-msg.user .chat-bubble {
      background: var(--color-purple);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .chat-msg.bot .chat-bubble {
      background: var(--glass-bg-light);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }
    .chat-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      object-fit: contain;
      background: rgba(167,139,250,0.15);
      flex-shrink: 0;
    }
    .chat-input-row {
      display: flex;
      gap: var(--space-2);
    }
    .chat-input {
      flex: 1;
      background: var(--glass-bg-light);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      padding: var(--space-2) var(--space-4);
      color: var(--text-primary);
      font-size: var(--font-size-sm);
      font-family: var(--font-main);
    }
    .chat-input::placeholder { color: var(--text-muted); }
    .chat-send-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--color-purple);
      border: none;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition-bounce);
      flex-shrink: 0;
    }
    .chat-send-btn:hover { transform: scale(1.1); }

    /* ── 파싱 미리보기 카드 ── */
    .parse-preview {
      background: linear-gradient(135deg, rgba(167,139,250,0.1), rgba(99,211,119,0.1));
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      display: none;
    }
    .parse-preview.show { display: block; }
    .parse-preview-title {
      font-size: var(--font-size-sm);
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: var(--space-2);
    }
    .parse-preview-rows {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: var(--space-1) var(--space-3);
      font-size: var(--font-size-xs);
      margin-bottom: var(--space-3);
    }
    .parse-key { color: var(--text-muted); font-weight: 700; }
    .parse-val { color: var(--text-primary); }

    /* ── 이벤트 목록 ── */
    .event-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      transition: all var(--transition-base);
    }
    .event-item:hover { background: var(--glass-bg-light); }
    .event-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .event-info { flex: 1; min-width: 0; }
    .event-title { font-size: var(--font-size-xs); font-weight: 700; color: var(--text-primary); }
    .event-meta { font-size: var(--font-size-2xs); color: var(--text-muted); margin-top: 1px; }
    .event-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      opacity: 0.6;
      transition: opacity var(--transition-fast);
    }
    .event-delete:hover { opacity: 1; color: var(--color-danger); }
  </style>
</head>
<body>
  <div class="background">
    <canvas id="star-canvas"></canvas>
    <div class="moon"></div>
  </div>

  <main class="phone">
    <header class="header">
      <div class="header-left">
        <button class="btn-back" onclick="location.href='../index.html'">←</button>
        <div>
          <h1>📅 캘린더</h1>
          <p class="subtitle">자연어로 일정을 등록하세요</p>
        </div>
      </div>
      <div class="header-right">
        <div class="chip-box" id="wool-display">
          <span class="icon">🧶</span>
          <span id="wool-count">0</span>
        </div>
      </div>
    </header>

    <div class="content">

      <!-- 월간 캘린더 -->
      <section class="glass card" style="padding: var(--space-4);">
        <div class="cal-header">
          <button class="cal-nav-btn" id="btn-prev-month">‹</button>
          <span class="cal-month-label" id="month-label"></span>
          <button class="cal-nav-btn" id="btn-next-month">›</button>
        </div>
        <div class="cal-weekdays">
          <div class="cal-weekday">일</div>
          <div class="cal-weekday">월</div>
          <div class="cal-weekday">화</div>
          <div class="cal-weekday">수</div>
          <div class="cal-weekday">목</div>
          <div class="cal-weekday">금</div>
          <div class="cal-weekday">토</div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </section>

      <!-- 선택된 날 이벤트 목록 -->
      <section class="glass card" style="padding: var(--space-4);">
        <div class="section-header" style="margin-bottom: var(--space-2);">
          <span class="section-title" id="selected-day-label">📋 오늘의 일정</span>
        </div>
        <div id="day-events-list" style="display:flex;flex-direction:column;gap:var(--space-2);">
          <div style="text-align:center;color:var(--text-muted);font-size:var(--font-size-xs);padding:var(--space-3);">일정 없음 ✨</div>
        </div>
      </section>

      <!-- 자연어 채팅형 일정 등록 -->
      <section class="glass card" style="padding: var(--space-4);">
        <div class="section-header" style="margin-bottom: var(--space-3);">
          <span class="section-title">💬 AI 일정 등록기</span>
        </div>
        <div style="font-size:var(--font-size-xs);color:var(--text-muted);margin-bottom:var(--space-2);line-height:1.5;">
          에타나 단톡에서 복사한 문장을 그대로 붙여넣으세요!
        </div>

        <!-- 채팅창 -->
        <div class="chat-container" id="chat-container">
          <div class="chat-msg bot">
            <img src="../assets/pet/poses/pose4.png" class="chat-avatar" alt="쉽라미">
            <div class="chat-bubble">안녕! 일정을 자연어로 말해줘 🐑<br><span style="color:rgba(255,255,255,0.5);font-size:0.65rem;">예: "내일 오후 2시 공학관 컴교론 발표"</span></div>
          </div>
        </div>
        <div class="chat-input-row">
          <input type="text" class="chat-input" id="nlp-input" placeholder="일정을 자연어로 입력하세요...">
          <button class="chat-send-btn" id="btn-nlp-send">➤</button>
        </div>

        <!-- 파싱 미리보기 -->
        <div class="parse-preview" id="parse-preview" style="margin-top: var(--space-3);">
          <div class="parse-preview-title">📌 인식된 일정 미리보기</div>
          <div class="parse-preview-rows" id="preview-rows"></div>
          <div style="display:flex;gap:var(--space-2);">
            <button class="btn btn-primary" id="btn-confirm-event" style="flex:1;">📅 캘린더에 즉시 등록</button>
            <button class="btn" id="btn-cancel-event" style="background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);">취소</button>
          </div>
        </div>
      </section>

      <!-- 예제 힌트 -->
      <section class="glass card" style="padding: var(--space-3);">
        <div style="font-size:var(--font-size-xs);font-weight:700;color:var(--text-secondary);margin-bottom:var(--space-2);">📝 이런 문장도 OK!</div>
        <div style="display:flex;flex-direction:column;gap:var(--space-1);">
          <div class="hint-item" data-hint="내일 오후 2시 공학관 3호관 컴교론 중간 대체 과제 발표 있음">💡 "내일 오후 2시 공학관 3호관 컴교론 중간 발표"</div>
          <div class="hint-item" data-hint="이번 주 일요일 밤 11시 59분까지 이산수학 레포트 제출 LMS">💡 "이번 주 일요일 밤 11시 59분 이산수학 레포트 LMS"</div>
          <div class="hint-item" data-hint="다음 주 목요일 오전 10시 소프트웨어학개론 시험">💡 "다음 주 목요일 10시 소프트학개론 시험"</div>
        </div>
      </section>

    </div>

    <nav class="bottom-nav">
      <div class="nav-item" data-href="../index.html">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">홈</span>
        <span class="nav-dot"></span>
      </div>
      <div class="nav-item" data-href="wake.html">
        <span class="nav-icon">⏰</span>
        <span class="nav-label">기상</span>
        <span class="nav-dot"></span>
      </div>
      <div class="nav-item active" data-href="calendar.html">
        <span class="nav-icon">📅</span>
        <span class="nav-label">캘린더</span>
        <span class="nav-dot"></span>
      </div>
      <div class="nav-item" data-href="friends.html">
        <span class="nav-icon">👥</span>
        <span class="nav-label">친구</span>
        <span class="nav-dot"></span>
      </div>
      <div class="nav-item" data-href="workshop.html">
        <span class="nav-icon">🧶</span>
        <span class="nav-label">공방</span>
        <span class="nav-dot"></span>
      </div>
      <div class="nav-item" data-href="gallery.html">
        <span class="nav-icon">🖼️</span>
        <span class="nav-label">갤러리</span>
        <span class="nav-dot"></span>
      </div>
    </nav>
  </main>

  <style>
    .hint-item {
      font-size: var(--font-size-xs);
      color: var(--color-purple-soft);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--radius-xs);
      transition: background var(--transition-fast);
      line-height: 1.5;
    }
    .hint-item:hover { background: rgba(167,139,250,0.1); }
  </style>

  <script type="module">
    import { initCommon, showToast } from '../js/app.js';
    import { getSheep } from '../js/storage.js';
    import {
      parseNaturalLanguage, getCategoryEmoji,
      getCalendarEvents, saveCalendarEvent, deleteCalendarEvent, getEventsForDate
    } from '../js/nlp-calendar.js';

    document.addEventListener('DOMContentLoaded', () => {
      initCommon();
      document.getElementById('wool-count').textContent = getSheep().wool;

      // ── 캘린더 상태 ──
      const now = new Date();
      let viewYear = now.getFullYear();
      let viewMonth = now.getMonth();
      let selectedDate = new Date(now);
      let pendingEvent = null;

      // ── 캘린더 렌더링 ──
      function renderCalendar() {
        const grid = document.getElementById('cal-grid');
        const label = document.getElementById('month-label');
        label.textContent = `${viewYear}년 ${viewMonth + 1}월`;

        const firstDay = new Date(viewYear, viewMonth, 1).getDay();
        const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();
        const prevLastDate = new Date(viewYear, viewMonth, 0).getDate();

        const events = getCalendarEvents();

        function countEventsOnDate(y, m, d) {
          return events.filter(e => {
            const ed = new Date(e.date);
            return ed.getFullYear() === y && ed.getMonth() === m && ed.getDate() === d;
          });
        }

        let html = '';
        let day = 1;
        const totalCells = Math.ceil((firstDay + lastDate) / 7) * 7;

        for (let i = 0; i < totalCells; i++) {
          let cellDate, isOtherMonth = false;

          if (i < firstDay) {
            cellDate = new Date(viewYear, viewMonth - 1, prevLastDate - firstDay + i + 1);
            isOtherMonth = true;
          } else if (day > lastDate) {
            cellDate = new Date(viewYear, viewMonth + 1, day - lastDate);
            isOtherMonth = true;
            day++;
          } else {
            cellDate = new Date(viewYear, viewMonth, day);
            day++;
          }

          const y = cellDate.getFullYear(), m = cellDate.getMonth(), d = cellDate.getDate();
          const isToday = y === now.getFullYear() && m === now.getMonth() && d === now.getDate();
          const isSelected = y === selectedDate.getFullYear() && m === selectedDate.getMonth() && d === selectedDate.getDate();
          const dayEvents = countEventsOnDate(y, m, d);

          const dots = dayEvents.slice(0, 3).map(e => `<div class="cal-dot cat-${e.category}" style="width:4px;height:4px;"></div>`).join('');

          html += `
            <div class="cal-day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''} ${isOtherMonth ? 'other-month' : ''}"
                 data-date="${y}-${m}-${d}">
              <span class="cal-day-num">${d}</span>
              <div class="cal-dots">${dots}</div>
            </div>`;
        }

        grid.innerHTML = html;

        grid.querySelectorAll('.cal-day').forEach(cell => {
          cell.addEventListener('click', () => {
            const [y, m, d] = cell.dataset.date.split('-').map(Number);
            selectedDate = new Date(y, m, d);
            renderCalendar();
            renderDayEvents(selectedDate);
          });
        });
      }

      function renderDayEvents(date) {
        const label = document.getElementById('selected-day-label');
        const list = document.getElementById('day-events-list');
        const dayStr = date.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
        label.textContent = `📋 ${dayStr} 일정`;

        const events = getEventsForDate(date);
        if (!events.length) {
          list.innerHTML = `<div style="text-align:center;color:var(--text-muted);font-size:var(--font-size-xs);padding:var(--space-3);">일정 없음 ✨</div>`;
          return;
        }

        list.innerHTML = events.map(e => `
          <div class="event-item">
            <div class="event-dot cat-${e.category}"></div>
            <div class="event-info">
              <div class="event-title">${getCategoryEmoji(e.category)} ${e.title}</div>
              <div class="event-meta">${e.timeStr || '시간 미정'} ${e.location ? '· ' + e.location : ''}</div>
            </div>
            <button class="event-delete" onclick="handleDeleteEvent(${e.id})">🗑️</button>
          </div>
        `).join('');
      }

      window.handleDeleteEvent = (id) => {
        deleteCalendarEvent(id);
        renderCalendar();
        renderDayEvents(selectedDate);
        showToast('일정 삭제됨', 'default');
      };

      // ── 월 이동 ──
      document.getElementById('btn-prev-month').addEventListener('click', () => {
        viewMonth--;
        if (viewMonth < 0) { viewMonth = 11; viewYear--; }
        renderCalendar();
      });
      document.getElementById('btn-next-month').addEventListener('click', () => {
        viewMonth++;
        if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        renderCalendar();
      });

      // ── 자연어 파서 ──
      const chatContainer = document.getElementById('chat-container');
      const nlpInput = document.getElementById('nlp-input');
      const btnSend = document.getElementById('btn-nlp-send');
      const parsePreview = document.getElementById('parse-preview');
      const previewRows = document.getElementById('preview-rows');

      function addChatMsg(text, isUser = false) {
        const div = document.createElement('div');
        div.className = `chat-msg ${isUser ? 'user' : 'bot'}`;
        if (!isUser) {
          div.innerHTML = `<img src="../assets/pet/poses/pose4.png" class="chat-avatar" alt="쉽라미"><div class="chat-bubble">${text}</div>`;
        } else {
          div.innerHTML = `<div class="chat-bubble">${text}</div>`;
        }
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      function sendNlpMessage() {
        const text = nlpInput.value.trim();
        if (!text) return;

        addChatMsg(text, true);
        nlpInput.value = '';

        // 파싱
        setTimeout(() => {
          const parsed = parseNaturalLanguage(text);
          pendingEvent = parsed;

          addChatMsg(`${getCategoryEmoji(parsed.category)} <strong>${parsed.title}</strong>로 등록할게요!<br><span style="font-size:0.65rem;opacity:0.7;">📅 ${parsed.dateStr} ⏰ ${parsed.timeStr}${parsed.location ? ' 📍 ' + parsed.location : ''}</span>`);

          previewRows.innerHTML = `
            <span class="parse-key">제목</span><span class="parse-val">${getCategoryEmoji(parsed.category)} ${parsed.title}</span>
            <span class="parse-key">날짜</span><span class="parse-val">${parsed.dateStr}</span>
            <span class="parse-key">시간</span><span class="parse-val">${parsed.timeStr}</span>
            ${parsed.location ? `<span class="parse-key">장소</span><span class="parse-val">📍 ${parsed.location}</span>` : ''}
            <span class="parse-key">분류</span><span class="parse-val">${parsed.category}</span>
          `;
          parsePreview.classList.add('show');
        }, 300);
      }

      btnSend.addEventListener('click', sendNlpMessage);
      nlpInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendNlpMessage(); });

      document.getElementById('btn-confirm-event').addEventListener('click', () => {
        if (!pendingEvent) return;
        saveCalendarEvent(pendingEvent);
        parsePreview.classList.remove('show');
        addChatMsg('✅ 캘린더에 등록했어요! 잊지 마세요 🐑');
        pendingEvent = null;
        renderCalendar();
        renderDayEvents(selectedDate);
        showToast('📅 일정 등록 완료!', 'success');
      });

      document.getElementById('btn-cancel-event').addEventListener('click', () => {
        parsePreview.classList.remove('show');
        pendingEvent = null;
        addChatMsg('취소했어요. 다시 말해줘! 🐑');
      });

      // ── 힌트 예제 클릭 ──
      document.querySelectorAll('.hint-item').forEach(item => {
        item.addEventListener('click', () => {
          nlpInput.value = item.dataset.hint;
          nlpInput.focus();
        });
      });

      // ── 초기화 ──
      renderCalendar();
      renderDayEvents(selectedDate);
    });
  </script>
</body>
</html>
