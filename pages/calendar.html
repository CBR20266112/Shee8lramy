<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>월별 학사 캘린더 & 에타 시간표 | Shee8lramy 쉽알라미</title>
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <style>
    /* ── 뷰 스위처 세그먼트 버튼 ── */
    .view-switcher-bar {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 4px;
      margin-bottom: var(--space-4);
      gap: 4px;
    }
    .switch-btn {
      flex: 1;
      padding: var(--space-2) var(--space-3);
      border: none;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-muted);
      font-size: var(--font-size-xs);
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .switch-btn.active {
      background: linear-gradient(135deg, rgba(167,139,250,0.35), rgba(124,58,237,0.35));
      color: #fff;
      border: 1px solid rgba(167,139,250,0.4);
      box-shadow: 0 4px 12px rgba(124,58,237,0.25);
    }

    /* 뷰 탭 페이드 애니메이션 */
    .tab-view {
      display: none;
      animation: fadeIn 0.35s ease forwards;
    }
    .tab-view.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── 1. 월별 학사 캘린더 ── */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: var(--space-4);
    }
    .cal-day-header {
      text-align: center;
      font-size: var(--font-size-2xs);
      font-weight: 800;
      color: var(--text-muted);
      padding: var(--space-1) 0;
    }
    .cal-cell {
      min-height: 54px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-sm);
      padding: 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
      position: relative;
    }
    .cal-cell:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(167, 139, 250, 0.3);
    }
    .cal-cell.selected {
      border-color: var(--color-purple-soft);
      background: rgba(167, 139, 250, 0.15);
    }
    .cal-cell.today {
      background: rgba(255, 217, 61, 0.1);
      border-color: rgba(255, 217, 61, 0.4);
    }
    .cal-cell.highlight-sojeon {
      border: 2px solid #ffd93d !important;
      background: linear-gradient(135deg, rgba(255,217,61,0.2), rgba(245,158,11,0.2)) !important;
      animation: pulseGold 2s infinite alternate;
    }
    .cal-cell.highlight-cpr {
      border: 2px solid #6bcb77 !important;
      background: linear-gradient(135deg, rgba(107,203,119,0.2), rgba(16,185,129,0.2)) !important;
    }
    @keyframes pulseGold {
      from { box-shadow: 0 0 4px rgba(255,217,61,0.4); }
      to { box-shadow: 0 0 14px rgba(255,217,61,0.8); }
    }

    .cal-num {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .cal-dots {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .dot-red { background: #ff6b6b; }
    .dot-yellow { background: #ffd93d; }
    .dot-blue { background: #4d96ff; }
    .dot-green { background: #6bcb77; }
    .dot-purple { background: #a78bfa; }

    /* ── 2. 에타 스타일 주간 시간표 ── */
    .timetable-grid {
      display: grid;
      grid-template-columns: 48px repeat(5, 1fr);
      gap: 2px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--glass-border);
    }
    .tt-header {
      background: rgba(0, 0, 0, 0.3);
      text-align: center;
      padding: 6px 0;
      font-size: var(--font-size-2xs);
      font-weight: 800;
      color: var(--text-secondary);
    }
    .tt-time-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-align: center;
      padding: 8px 0;
      border-top: 1px dashed rgba(255,255,255,0.05);
    }
    .tt-card {
      padding: 6px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.65rem;
      line-height: 1.3;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      position: relative;
    }
    .tt-card-title { font-weight: 800; font-size: 0.7rem; }
    .tt-card-room { opacity: 0.85; font-size: 0.6rem; }

    .tt-empty-gap {
      border: 1px dashed rgba(255, 217, 61, 0.3);
      border-radius: 6px;
      background: rgba(255, 217, 61, 0.05);
      color: #ffd93d;
      font-size: 0.6rem;
      padding: 6px;
      text-align: center;
      font-weight: 700;
    }

    /* ── 3. 도보 동선 안내 위젯 ── */
    .route-widget {
      background: linear-gradient(135deg, rgba(77,150,255,0.15), rgba(167,139,250,0.15));
      border: 1px solid rgba(77,150,255,0.3);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      position: relative;
    }
    .route-map-svg {
      width: 100%;
      height: 60px;
      margin-top: 8px;
    }
    .path-line {
      stroke: #a78bfa;
      stroke-dasharray: 6;
      animation: dashMove 1.5s linear infinite;
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -12; }
    }

    /* ── NLP 퀵 테스트 버튼 ── */
    .quick-btn-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: var(--space-2);
      scrollbar-width: none;
    }
    .quick-btn {
      white-space: nowrap;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(167,139,250,0.3);
      background: rgba(167,139,250,0.1);
      color: var(--color-purple-soft);
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .quick-btn:hover {
      background: rgba(167,139,250,0.25);
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- 밤하늘 배경 -->
  <div class="background">
    <canvas id="star-canvas"></canvas>
    <div class="moon"></div>
  </div>

  <main class="phone">
    <!-- 헤더 -->
    <header class="header">
      <div class="header-left">
        <button class="btn-back" onclick="location.href='../index.html'" title="뒤로가기">←</button>
        <div>
          <h1>📅 학사 캘린더 & 시간표</h1>
          <p class="subtitle">국립순천대 컴교과 전용 스케줄 에이전트</p>
        </div>
      </div>
      <div class="header-right">
        <div class="chip-box" id="wool-display">
          <span class="icon">🧶</span>
          <span id="wool-count">0</span>
        </div>
      </div>
    </header>

    <!-- 스크롤 영역 -->
    <div class="content">

      <!-- 상단 세그먼트 뷰 스위처 -->
      <div class="view-switcher-bar">
        <button type="button" class="switch-btn active" id="btn-view-month">
          📅 월별 학사 캘린더
        </button>
        <button type="button" class="switch-btn" id="btn-view-timetable">
          ⏱️ 주간 시간표 (에타형)
        </button>
      </div>

      <!-- ─── [뷰 A: 월별 학사 캘린더] ─── -->
      <div class="tab-view active" id="view-month-container">
        <!-- 캘린더 월 이동 네비게이션 -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3);">
          <div style="display:flex;align-items:center;gap:8px;">
            <button type="button" class="btn btn-secondary btn-sm" id="btn-prev-month" style="padding:2px 8px;font-size:0.75rem;">◀ 이전달</button>
            <div style="font-size:var(--font-size-md);font-weight:900;color:var(--text-primary);" id="cal-month-title">2026년 11월</div>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-next-month" style="padding:2px 8px;font-size:0.75rem;">다음달 ▶</button>
          </div>
          <div style="font-size:0.6rem;color:var(--text-muted);">
            🔴시험 🟡과제 🔵행사 🟢의무
          </div>
        </div>

        <!-- 월간 그리드 -->
        <div class="calendar-grid" id="calendar-grid">
          <!-- JS 렌더링 -->
        </div>

        <!-- 당일 상세 일정 브리핑 카드 -->
        <section class="glass card" style="padding: var(--space-4);" id="day-briefing-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3);">
            <h3 class="font-bold" style="font-size:var(--font-size-sm);color:var(--text-secondary);" id="selected-date-title">📌 선택 날짜 일정 브리핑</h3>
            <span class="countdown-badge" id="selected-date-dday">D-Day</span>
          </div>
          <div id="selected-date-events" style="display:flex;flex-direction:column;gap:var(--space-2);">
            <!-- 이벤트 리스트 -->
          </div>
        </section>
      </div>

      <!-- ─── [뷰 B: 주간 시간표 (에타형)] ─── -->
      <div class="tab-view" id="view-timetable-container">
        
        <!-- 🚶 캠퍼스 다음 강의실 도보 동선 브리핑 카드 위젯 -->
        <div class="route-widget">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="font-size:var(--font-size-xs);font-weight:900;color:var(--color-purple-soft);">🚶 다음 강의실 도보 동선 내비</div>
            <span style="font-size:0.65rem;padding:2px 8px;border-radius:12px;background:rgba(107,203,119,0.2);color:#6bcb77;font-weight:800;">세이프 🟢 (+4분 여유)</span>
          </div>
          
          <div style="margin-top:8px;font-size:var(--font-size-xs);color:var(--text-primary);line-height:1.5;">
            <div><strong>현재:</strong> 공학관 3호관 302호 <span style="color:var(--text-muted);">(데이터베이스)</span></div>
            <div><strong>다음:</strong> 사범관 2호관 105호 <span style="color:var(--text-muted);">(컴퓨터교육론)</span></div>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:var(--font-size-2xs);color:var(--text-muted);">
            <span>🏃 도보 소요시간: <strong>약 6분 (410m)</strong></span>
            <span>쉬는 시간 10분 중 4분 여유</span>
          </div>

          <!-- 간이 캠퍼스 미니 맵 SVG -->
          <svg class="route-map-svg" viewBox="0 0 300 50">
            <rect x="10" y="10" width="60" height="30" rx="6" fill="rgba(167,139,250,0.3)" stroke="#a78bfa" stroke-width="1.5"/>
            <text x="40" y="28" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">공학관 3호관</text>
            <path d="M 70 25 Q 150 5 230 25" fill="none" class="path-line" stroke-width="2"/>
            <rect x="230" y="10" width="60" height="30" rx="6" fill="rgba(107,203,119,0.3)" stroke="#6bcb77" stroke-width="1.5"/>
            <text x="260" y="28" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">사범관 2호관</text>
          </svg>
        </div>

        <!-- 30분 단위 주간 시간표 -->
        <div class="timetable-grid" id="timetable-grid">
          <!-- JS 렌더링 -->
        </div>
      </div>

      <!-- 하단 자연어 채팅형 일정 등록기 -->
      <section class="glass card" style="padding: var(--space-4); margin-top: var(--space-4);">
        <div style="font-size:var(--font-size-xs);font-weight:800;color:var(--text-secondary);margin-bottom:var(--space-2);">💬 자연어 일정 자동 등록 (카카오톡 스타일)</div>
        
        <!-- 단톡방 공지 시연용 퀵 버튼 3종 -->
        <div class="quick-btn-bar">
          <button type="button" class="quick-btn" id="btn-quick-1">🔘 [소전 최종평가 공지]</button>
          <button type="button" class="quick-btn" id="btn-quick-2">🔘 [CPR 의무교육 공지]</button>
          <button type="button" class="quick-btn" id="btn-quick-3">🔘 [학생회 입후보 공지]</button>
        </div>

        <!-- 파싱 미리보기 카드 -->
        <div id="nlp-preview-card" style="display:none;background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.3);padding:var(--space-3);border-radius:var(--radius-sm);margin-bottom:var(--space-3);">
          <div style="font-size:var(--font-size-2xs);color:var(--color-purple-soft);font-weight:700;">✨ 파싱 결과 미리보기</div>
          <div id="nlp-preview-text" style="font-size:var(--font-size-xs);color:#fff;font-weight:800;margin-top:2px;"></div>
        </div>

        <div style="display:flex;gap:var(--space-2);">
          <input type="text" id="input-nlp-chat" class="glass" style="flex:1;border-radius:var(--radius-sm);border:1px solid var(--glass-border);padding:var(--space-3);color:#fff;font-size:var(--font-size-xs);" placeholder="예: 11월 3일 화요일 오후 2시 공학관 3호관 소전 평가">
          <button type="button" class="btn btn-primary" id="btn-add-nlp-chat" style="font-size:var(--font-size-xs);padding:0 16px;">등록</button>
        </div>
      </section>

    </div>

    <!-- 하단 네비게이션 (6탭) -->
    <nav class="bottom-nav">
      <div class="nav-item" data-href="../index.html">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">홈</span>
        <span class="nav-dot"></span>
      </div>
      <div class="nav-item" data-href="wake.html">
        <span class="nav-icon">⏰</span>
        <span class="nav-label">기상</span>
        <span class="nav-dot"></span>
      </div>
      <div class="nav-item active" data-href="calendar.html">
        <span class="nav-icon">📅</span>
        <span class="nav-label">캘린더</span>
        <span class="nav-dot"></span>
      </div>
      <div class="nav-item" data-href="friends.html">
        <span class="nav-icon">👥</span>
        <span class="nav-label">친구</span>
        <span class="nav-dot"></span>
      </div>
      <div class="nav-item" data-href="workshop.html">
        <span class="nav-icon">🧶</span>
        <span class="nav-label">공방</span>
        <span class="nav-dot"></span>
      </div>
      <div class="nav-item" data-href="gallery.html">
        <span class="nav-icon">🖼️</span>
        <span class="nav-label">갤러리</span>
        <span class="nav-dot"></span>
      </div>
    </nav>
  </main>

  <!-- 특수 행사 팝업 모달 -->
  <div class="overlay" id="event-popup-overlay"></div>
  <div class="modal" id="event-popup-modal" style="max-width: 90%; width: 360px;">
    <div class="modal-handle"></div>
    <h3 class="font-bold text-center" style="font-size: var(--font-size-md); margin-bottom: var(--space-3);" id="popup-modal-title">⭐ 이벤트 안내</h3>
    <div style="font-size: var(--font-size-xs); line-height: 1.6; color: var(--text-primary); margin-bottom: var(--space-4);" id="popup-modal-body"></div>
    <button type="button" class="btn btn-primary w-full" id="btn-close-event-popup">확인했습니다</button>
  </div>

  <script type="module">
    import { initCommon, showToast } from '../js/app.js';
    import { getSheep } from '../js/storage.js';
    import { parseNaturalLanguage, getCalendarEvents, saveCalendarEvent, TIMETABLE_COURSES } from '../js/nlp-calendar.js';

    document.addEventListener('DOMContentLoaded', () => {
      initCommon();
      document.getElementById('wool-count').textContent = getSheep().wool;

      // ─── 뷰 스위처 ───
      const btnViewMonth = document.getElementById('btn-view-month');
      const btnViewTimetable = document.getElementById('btn-view-timetable');
      const viewMonthContainer = document.getElementById('view-month-container');
      const viewTimetableContainer = document.getElementById('view-timetable-container');

      btnViewMonth.addEventListener('click', () => {
        btnViewMonth.classList.add('active');
        btnViewTimetable.classList.remove('active');
        viewMonthContainer.classList.add('active');
        viewTimetableContainer.classList.remove('active');
      });

      btnViewTimetable.addEventListener('click', () => {
        btnViewTimetable.classList.add('active');
        btnViewMonth.classList.remove('active');
        viewTimetableContainer.classList.add('active');
        viewMonthContainer.classList.remove('active');
      });

      // ─── 1. 월별 학사 캘린더 렌더링 & 월 이동 ───
      let currentYear = 2026;
      let currentMonthIdx = 10; // 0-indexed: 10 = 11월

      const calGrid = document.getElementById('calendar-grid');
      const calMonthTitle = document.getElementById('cal-month-title');
      const selectedDateTitle = document.getElementById('selected-date-title');
      const selectedDateEvents = document.getElementById('selected-date-events');
      const selectedDateDday = document.getElementById('selected-date-dday');
      const btnPrevMonth = document.getElementById('btn-prev-month');
      const btnNextMonth = document.getElementById('btn-next-month');

      const DAYS = ['일', '월', '화', '수', '목', '금', '토'];

      btnPrevMonth.addEventListener('click', () => {
        if (currentMonthIdx > 8) { // 최소 9월
          currentMonthIdx--;
          renderCalendar();
        } else {
          showToast('2026학년도 2학기 범위 내에서 이동 가능합니다.', 'default');
        }
      });

      btnNextMonth.addEventListener('click', () => {
        if (currentMonthIdx < 10) { // 최대 11월
          currentMonthIdx++;
          renderCalendar();
        } else {
          showToast('11월 학사 일정이 최종 월입니다.', 'default');
        }
      });

      function renderCalendar() {
        calMonthTitle.textContent = `${currentYear}년 ${currentMonthIdx + 1}월`;
        calGrid.innerHTML = '';
        DAYS.forEach(d => {
          const h = document.createElement('div');
          h.className = 'cal-day-header';
          h.textContent = d;
          calGrid.appendChild(h);
        });

        const firstDay = new Date(currentYear, currentMonthIdx, 1).getDay();
        const totalDays = new Date(currentYear, currentMonthIdx + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
          const empty = document.createElement('div');
          empty.className = 'cal-cell';
          empty.style.opacity = '0.2';
          calGrid.appendChild(empty);
        }

        const events = getCalendarEvents();

        for (let day = 1; day <= totalDays; day++) {
          const monthStr = String(currentMonthIdx + 1).padStart(2, '0');
          const dayStr = String(day).padStart(2, '0');
          const dateStr = `${currentYear}-${monthStr}-${dayStr}`;
          const dayEvents = events.filter(e => e.date === dateStr);

          const cell = document.createElement('div');
          let extraClass = '';
          if (dateStr === '2026-11-17') extraClass = 'highlight-sojeon';
          if (dateStr === '2026-11-19') extraClass = 'highlight-cpr';

          cell.className = `cal-cell ${extraClass}`;
          cell.dataset.dateStr = dateStr;

          const num = document.createElement('div');
          num.className = 'cal-num';
          num.innerHTML = day === 17 && currentMonthIdx === 10 ? '⭐ 17' : day;
          cell.appendChild(num);

          if (dayEvents.length > 0) {
            const dots = document.createElement('div');
            dots.className = 'cal-dots';
            dayEvents.forEach(e => {
              const dot = document.createElement('div');
              const type = e.type || (e.category.includes('시험') ? 'red' : e.category.includes('과제') ? 'yellow' : 'blue');
              dot.className = `dot dot-${type}`;
              dots.appendChild(dot);
            });
            cell.appendChild(dots);
          }

          cell.addEventListener('click', () => {
            document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
            cell.classList.add('selected');

            // 특수 날짜 모달 팝업 인터랙션
            if (dateStr === '2026-11-17') {
              showEventModal('⭐ 2026 소프트웨어 전시회 (소전 본행사)', '🏆 우석홀 부스 지킴이 / 전체 학생 필수 출석 체크!<br>학과장님 축사 및 프로젝트 부스 운영 (미출석 시 학점 불이익)');
            } else if (dateStr === '2026-11-19') {
              showEventModal('🚨 사범관 1호관 CPR 교육 경고', '⚠️ 교원자격증 필수 이수 요건!<br>결석 시 1년 유예되며 졸업이 불가합니다. 편한 바지를 반드시 착용하세요.');
            }

            renderDayBriefing(dateStr, dayEvents);
          });

          calGrid.appendChild(cell);
        }

        // 초기 11월 17일 브리핑 세팅
        if (currentMonthIdx === 10) {
          renderDayBriefing('2026-11-17', events.filter(e => e.date === '2026-11-17'));
        } else {
          renderDayBriefing(`${currentYear}-${String(currentMonthIdx + 1).padStart(2, '0')}-01`, events.filter(e => e.date.endsWith('-01')));
        }
      }

      function renderDayBriefing(dateStr, dayEvents) {
        selectedDateTitle.textContent = `📌 ${dateStr} 상세 일정 브리핑`;
        selectedDateEvents.innerHTML = '';

        if (!dayEvents || dayEvents.length === 0) {
          selectedDateEvents.innerHTML = '<div style="font-size:var(--font-size-xs);color:var(--text-muted);text-align:center;padding:12px;">등록된 스케줄이 없습니다. 공강을 즐기세요! ☕</div>';
          selectedDateDday.textContent = 'D-Day';
          return;
        }

        selectedDateDday.textContent = dayEvents[0].dday || 'D-Day';

        dayEvents.forEach(e => {
          const item = document.createElement('div');
          item.style.cssText = 'display:flex;flex-direction:column;gap:4px;padding:10px 12px;background:rgba(255,255,255,0.04);border-radius:6px;border:1px solid rgba(255,255,255,0.08);';
          item.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="font-size:var(--font-size-xs);font-weight:800;color:#fff;">${e.category} ${e.title}</div>
              <span style="font-size:0.65rem;padding:2px 8px;border-radius:10px;background:rgba(167,139,250,0.2);color:var(--color-purple-soft);font-weight:700;">${e.dday || '진행중'}</span>
            </div>
            <div style="font-size:var(--font-size-2xs);color:var(--text-muted);">📍 ${e.location} ${e.time ? `(${e.time})` : ''}</div>
            ${e.memo ? `<div style="font-size:0.65rem;color:#ffd93d;background:rgba(255,217,61,0.1);padding:4px 8px;border-radius:4px;margin-top:2px;">💡 ${e.memo}</div>` : ''}
          `;
          selectedDateEvents.appendChild(item);
        });
      }

      // ─── 특수 행사 모달 ───
      const popupOverlay = document.getElementById('event-popup-overlay');
      const popupModal = document.getElementById('event-popup-modal');
      const popupTitle = document.getElementById('popup-modal-title');
      const popupBody = document.getElementById('popup-modal-body');
      const btnClosePopup = document.getElementById('btn-close-event-popup');

      function showEventModal(title, htmlContent) {
        popupTitle.textContent = title;
        popupBody.innerHTML = htmlContent;
        popupOverlay.classList.add('active');
        popupModal.classList.add('active');
      }

      btnClosePopup.addEventListener('click', () => {
        popupOverlay.classList.remove('active');
        popupModal.classList.remove('active');
      });
      popupOverlay.addEventListener('click', () => {
        popupOverlay.classList.remove('active');
        popupModal.classList.remove('active');
      });

      // ─── 2. 주간 시간표 렌더링 ───
      const ttGrid = document.getElementById('timetable-grid');

      function renderTimetable() {
        ttGrid.innerHTML = '';
        const emptyH = document.createElement('div');
        emptyH.className = 'tt-header';
        emptyH.textContent = '시간';
        ttGrid.appendChild(emptyH);

        ['월', '화', '수', '목', '금'].forEach(d => {
          const h = document.createElement('div');
          h.className = 'tt-header';
          h.textContent = d;
          ttGrid.appendChild(h);
        });

        const hours = ['09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00'];
        
        hours.forEach(hr => {
          const lbl = document.createElement('div');
          lbl.className = 'tt-time-label';
          lbl.textContent = hr;
          ttGrid.appendChild(lbl);

          for (let dayIdx = 1; dayIdx <= 5; dayIdx++) {
            const cell = document.createElement('div');
            cell.style.cssText = 'min-height:48px;padding:2px;position:relative;border-top:1px dashed rgba(255,255,255,0.05);';

            if (dayIdx === 4 && hr === '11:00') {
              cell.innerHTML = '<div class="tt-empty-gap">🚀 달콤한 전일 올공강 (All 공강!)</div>';
            } else {
              const course = TIMETABLE_COURSES.find(c => c.day === dayIdx && c.start <= hr && c.end > hr);
              if (course && course.start === hr) {
                cell.innerHTML = `
                  <div class="tt-card" style="background:${course.color}">
                    <div class="tt-card-title">${course.name}</div>
                    <div class="tt-card-room">${course.room}</div>
                  </div>
                `;
              } else if (!course && dayIdx === 3 && hr === '11:00') {
                cell.innerHTML = '<div class="tt-empty-gap">☕ 달콤한 공강 (1.5시간)</div>';
              }
            }
            ttGrid.appendChild(cell);
          }
        });
      }

      // ─── 3. 자연어 입력 & 퀵 예시 버튼 3종 ───
      const inputChat = document.getElementById('input-nlp-chat');
      const btnAddChat = document.getElementById('btn-add-nlp-chat');
      const nlpPreviewCard = document.getElementById('nlp-preview-card');
      const nlpPreviewText = document.getElementById('nlp-preview-text');

      const btnQuick1 = document.getElementById('btn-quick-1');
      const btnQuick2 = document.getElementById('btn-quick-2');
      const btnQuick3 = document.getElementById('btn-quick-3');

      btnQuick1.addEventListener('click', () => {
        inputChat.value = "얘들아 11월 3일 화요일 오후 2시 공학관 3호관에서 소전 최종평가 진행한대. 노트북 충전기랑 시연 PPT 필수 지참!";
        inputChat.dispatchEvent(new Event('input'));
      });

      btnQuick2.addEventListener('click', () => {
        inputChat.value = "11월 19일 목요일 오후 3시 사범관 대강당 심폐소생술 교육 결석하면 교원자격증 발급 안 됨 편한 바지 입고 올 것";
        inputChat.dispatchEvent(new Event('input'));
      });

      btnQuick3.addEventListener('click', () => {
        inputChat.value = "2027학년도 학생회 회장 부회장 총무 입후보 등록 11월 16일부터 11월 30일 오후 6시까지 과사로 서류 제출";
        inputChat.dispatchEvent(new Event('input'));
      });

      inputChat.addEventListener('input', () => {
        const val = inputChat.value.trim();
        if (!val) {
          nlpPreviewCard.style.display = 'none';
          return;
        }
        const parsed = parseNaturalLanguage(val);
        nlpPreviewCard.style.display = 'block';
        nlpPreviewText.textContent = `${parsed.category} "${parsed.title}" (${parsed.dateStr} ${parsed.timeStr} @ ${parsed.location})`;
      });

      btnAddChat.addEventListener('click', () => {
        const val = inputChat.value.trim();
        if (!val) return;
        const parsed = parseNaturalLanguage(val);
        
        saveCalendarEvent({
          date: parsed.dateStr,
          title: parsed.title,
          category: parsed.category,
          location: parsed.location,
          type: parsed.category.includes('시험') ? 'red' : parsed.category.includes('의무') ? 'green' : 'purple',
          dday: 'NEW',
          memo: val,
        });

        showToast('🎉 스케줄이 월별 캘린더 & 주간 시간표에 등록되었습니다!', 'success');
        inputChat.value = '';
        nlpPreviewCard.style.display = 'none';

        // 11월 뷰로 자동 전환
        currentMonthIdx = 10;
        renderCalendar();
        renderTimetable();
      });

      // 초기 실행
      renderCalendar();
      renderTimetable();
    });
  </script>
</body>
</html>
